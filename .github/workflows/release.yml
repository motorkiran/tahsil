name: Release

# Pushing a version tag, such as v0.1.0, releases that version: a multi-arch container image on GitHub Container
# Registry, a GitHub release with the packages, and the packages on NuGet once the NUGET_API_KEY secret is set.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Signs the attestations of the image and the packages with Sigstore, through GitHub's OIDC token.
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --configuration Release -p:Version="$VERSION"

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Packs the projects marked packable (the contracts and the SDK, once they exist).
      - name: Pack
        run: dotnet pack Tahsil.slnx --configuration Release --no-build -p:Version="$VERSION" --output artifacts

      # Conditions cannot read secrets, so this step tells whether the key is set, without exposing it to other steps.
      - name: Check for a NuGet key
        id: nuget
        run: echo "enabled=${{ secrets.NUGET_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish packages
        if: steps.nuget.outputs.enabled == 'true' && hashFiles('artifacts/*.nupkg') != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish container image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          tags="$VERSION"
          # Pre-releases, such as 0.2.0-rc.1, do not move "latest".
          if [[ "$VERSION" != *-* ]]; then tags="$tags;latest"; fi
          # Restore needs the runtimes too, or the image for each of them cannot be built.
          runtimes='"linux-x64;linux-arm64"'
          dotnet publish src/Tahsil.Server --configuration Release -p:Version="$VERSION" \
            -t:PublishContainer -p:ContainerRegistry=ghcr.io -p:ContainerRepository="${GITHUB_REPOSITORY,,}" \
            -p:ContainerImageTags="\"$tags\"" -p:RuntimeIdentifiers="$runtimes" -p:ContainerRuntimeIdentifiers="$runtimes"

      - name: Image digest
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      # The image's software bill of materials (SPDX), attached to the release and attested to the image.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: artifacts/tahsil-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Signed provenance and SBOM attestations, pushed to the registry beside the image. Anyone can check them:
      #   gh attestation verify oci://ghcr.io/motorkiran/tahsil:<version> --owner motorkiran
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest the image's SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: artifacts/tahsil-${{ env.VERSION }}.spdx.json
          push-to-registry: true

      - name: Attest the packages' provenance
        if: hashFiles('artifacts/*.nupkg') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.nupkg

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.nupkg artifacts/*.snupkg artifacts/*.spdx.json)
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Tahsil $VERSION" --generate-notes $prerelease
